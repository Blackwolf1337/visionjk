//*******************************************************************************************************************
//JA+ Mod CHAT MOD CONFIG FILE
//*******************************************************************************************************************
// this file enable to bind key in order to change the chat mod
// You can chat with your team, or your clan, or with admins without others players can read.
// you also can chat in ampsay mod for admins.
// You have to use the say_team binded key to chat (bind it in your game menu)  and another key to change the chat mod
//

//**************************
//USING THIS SCRIPT
//*************************

// During the game type /exec chat.cfg in order to bind the keys
// Then type /clanpass "your_clan_chat_password"
// If you activate the team chat mod to "clan", using the say_team key, all players who have the same clanpass as you will
// be able to read your message 


bind = "vstr CHANGE_TEAM_CHAT" // this is the binded key to use to change the chat MOD


//**********************************************
//DO NOT MODIFY AFTER
//
//**********************************************

seta CHANGE_TEAM_CHAT "vstr say_team_chatMOD2"
seta say_team_chatMOD1 "echo ^4TEAM CHAT MOD : ^5Team;say_team_mod normal;set CHANGE_TEAM_CHAT vstr say_team_chatMOD2"
seta say_team_chatMOD2 "echo ^4TEAM CHAT MOD : ^1Clan;say_team_mod clan;set CHANGE_TEAM_CHAT vstr say_team_chatMOD3"
seta say_team_chatMOD3 "echo ^4TEAM CHAT MOD : ^3Admin;say_team_mod admin;set CHANGE_TEAM_CHAT vstr say_team_chatMOD4"
seta say_team_chatMOD4 "echo ^4TEAM CHAT MOD : ^3AmPsay;say_team_mod ampsay;set CHANGE_TEAM_CHAT vstr say_team_chatMOD1"