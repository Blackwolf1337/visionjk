//***********************************************************************************
// AUthor: Slider
// ADMIN GUNS AND Cycle Cmds/players BINDS Selection
//
// this script enable you to execute admin CMDS on player without going into the console
// THis script contains admin cmd to execute on specific player AND ADMIN GUN
//
// Just change the binded KEy 
// For example : bind X "vstr ADMIN_CMD_NEXT" => you can change the key X by everything
// you want like A or F or KP_ENTER ....   
//place this script into your japlus directory and then juste type into console /exec admin
//***********************************************************************************




bind , "vstr ADMIN_CMD_NEXT"              // next admin CMDs or players or admin gun
bind SEMICOLON "vstr ADMIN_CMD_PREV"      // prev admin CMDs or players or admin gun
bind : "vstr ADMIN_CMD_SWITH"             // swith between player selection and admin cmd and admin guns selections
bind KP_PLUS "vstr ADMIN_CMD_EXE"               // execute the cmd on the selected player or execute the admun gun on the player in your hud






//**********************************************************************************
//
//DO NOT MODIFY AFTER
//
//**********************************************************************************

seta ADMIN_CMD_NEXT "admCmdNext"
seta ADMIN_CMD_PREV "admCmdPrev"
seta ADMIN_CMD_EXE "admCmdEXE"

seta ADMIN_CMD_SWITH "vstr ADMIN_CMD_SWITH1"

seta ADMIN_CMD_SWITH1 "echo ^5Player Cycle Selection;set ADMIN_CMD_NEXT playerNext;set ADMIN_CMD_PREV playerPrev;set ADMIN_CMD_EXE admCmdEXE; set ADMIN_CMD_SWITH vstr ADMIN_CMD_SWITH2"
seta ADMIN_CMD_SWITH2 "echo ^5ADM CMDs Cycle Selection;set ADMIN_CMD_NEXT admCmdNext;set ADMIN_CMD_PREV admCmdPrev;set ADMIN_CMD_EXE admCmdEXE; set ADMIN_CMD_SWITH vstr ADMIN_CMD_SWITH3"
seta ADMIN_CMD_SWITH3 "echo ^5Admin Guns;set ADMIN_CMD_NEXT vstr NXT_GUN;set ADMIN_CMD_PREV vstr PRV_GUN;set ADMIN_CMD_EXE vstr EXE_GUN; set ADMIN_CMD_SWITH vstr ADMIN_CMD_SWITH1"


seta NXT_GUN "vstr adm_gun1"
seta PRV_GUN "vstr adm_gun17"
seta EXE_GUN "gunempower"

seta adm_gun1 "echo ^5Gun Empower;set EXE_GUN gunempower;set PRV_GUN vstr adm_gun17;set NXT_GUN vstr adm_gun2"
seta adm_gun2 "echo ^5Gun Merc;set EXE_GUN gunmerc;set PRV_GUN vstr adm_gun1;set NXT_GUN vstr adm_gun3"
seta adm_gun3 "echo ^5Gun ForceAltDim;set EXE_GUN gunForceAltDim;set PRV_GUN vstr adm_gun2;set NXT_GUN vstr adm_gun4"
seta adm_gun4 "echo ^5Gun unForceAltDim;set EXE_GUN gununForceAltDim;set PRV_GUN vstr adm_gun3;set NXT_GUN vstr adm_gun5"
seta adm_gun5 "echo ^5Gun silence;set EXE_GUN gunsilence;set PRV_GUN vstr adm_gun4;set NXT_GUN vstr adm_gun6"
seta adm_gun6 "echo ^5Gun unsilence;set EXE_GUN gununsilence;set PRV_GUN vstr adm_gun5;set NXT_GUN vstr adm_gun7"
seta adm_gun7 "echo ^5Gun protect;set EXE_GUN gunprotect;set PRV_GUN vstr adm_gun6;set NXT_GUN vstr adm_gun8"
seta adm_gun8 "echo ^5Gun ghost;set EXE_GUN gunghost;set PRV_GUN vstr adm_gun7;set NXT_GUN vstr adm_gun9"
seta adm_gun9 "echo ^5Gun denyVote;set EXE_GUN gundenyvote;set PRV_GUN vstr adm_gun8;set NXT_GUN vstr adm_gun10"
seta adm_gun10 "echo ^5Gun sleep;set EXE_GUN gunsleep;set PRV_GUN vstr adm_gun9;set NXT_GUN vstr adm_gun11"
seta adm_gun11 "echo ^5Gun wake;set EXE_GUN gunwake;set PRV_GUN vstr adm_gun10;set NXT_GUN vstr adm_gun12"
seta adm_gun12 "echo ^5Gun slap;set EXE_GUN gunslap;set PRV_GUN vstr adm_gun11;set NXT_GUN vstr adm_gun13"
seta adm_gun13 "echo ^5Gun showmotd;set EXE_GUN gunshowmotd;set PRV_GUN vstr adm_gun12;set NXT_GUN vstr adm_gun14"
seta adm_gun14 "echo ^5Gun origin;set EXE_GUN gunorigin;set PRV_GUN vstr adm_gun13;set NXT_GUN vstr adm_gun15"
seta adm_gun15 "echo ^5Gun kick;set EXE_GUN gunkick;set PRV_GUN vstr adm_gun14;set NXT_GUN vstr adm_gun16"
seta adm_gun16 "echo ^5Gun ban;set EXE_GUN gunban;set PRV_GUN vstr adm_gun15;set NXT_GUN vstr adm_gun17"
seta adm_gun17 "echo ^5Gun mindtrick;set EXE_GUN gunmindtrick;set PRV_GUN vstr adm_gun16;set NXT_GUN vstr adm_gun1"