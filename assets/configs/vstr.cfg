/*
//          Several VSTR Variables
//          Author : Slider
//
//      they are to be used with /rcon vstr cmd or /amvstr cmd
//      for ex : /amvstr GAMETYPE => enable to change easily some cvars when you want to change gametype
//      You are free to add you own settings or modify .
//	
//	HOW TO INSTALL ?
//	add exec vstr.cfg in the server.cfg at server side and upload this file at your japlus folder at server side.
//
//      HOW TO USE?:
//	/amvstr vstr_var_name => use it several times to cycle between the various setting
//	
//	Complete list:
//		- GAMETYPE : to change server setting according to the various gametype 
//				before to change the map with /ammap gametype map_name 
//
//		- WEAPONS : cycle between the different weapons setting like saber only or all weapons....
//				then you must change the map
//
//		- FORCE: cycle between the different force setting, no force, full force...etc..
//				then change the map
//
//		- JediVSMerc : cycle between the various jedi vs merc settings. then you must change the map
//
//
*/

seta GAMETYPE "vstr FFA"
seta SIEGE "seta g_gametype 7;set GAMETYPE vstr TEAM;say ^5SIEGE GameType ^1gameplay activation;seta g_forceRegenTime 200;seta jp_allowJetpack 0;seta jp_allowHook 0;seta jp_allowTeamKill 1"
seta TEAM "seta g_gametype 6;set GAMETYPE vstr CTF;say ^5TEAM GameType ^1gameplay activation;seta g_forceRegenTime 200;seta jp_allowJetpack 0;seta jp_allowHook 2;seta jp_allowTeamKill 0"
seta CTF "seta g_gametype 8;set GAMETYPE vstr FFA;say ^5CTF GameType ^1gameplay activation;seta g_forceRegenTime 200;seta jp_allowJetpack 0;seta jp_allowHook 0;seta jp_allowTeamKill 1"
seta FFA  "seta g_gametype 0;set GAMETYPE vstr SIEGE;say ^5FFA GameType ^1gameplay activation;seta g_forceRegenTime 140;seta jp_allowJetpack 1;seta jp_allowHook 1;seta jp_allowTeamKill 0"

seta WEAPONS "vstr SABER_ONLY"
seta SABER_ONLY "set WEAPONS vstr ALL_WEAPONS;say ^5SABER Only;seta g_weaponDisable 524279"
seta ALL_WEAPONS "set WEAPONS vstr SABER_ONLY;say ^5ALL Weapons activated;seta g_weaponDisable 0"

seta FORCE "vstr FULL_FORCE"
seta FULL_FORCE "say ^5Full force activation;set FORCE vstr NO_FORCE;seta g_forcePowerDisable 0"
seta NO_FORCE "say ^5No force activation;set FORCE vstr FULL_FORCE;seta g_forcePowerDisable 32765"

seta JediVSMerc "vstr jvm1"
seta jvm1 "set JediVSMerc vstr jvm2;say ^5Jedi Vs Merc -> 0;seta g_jediVmerc 0"
seta jvm2 "set JediVSMerc vstr jvm3;say ^1Classic ^5Jedi Vs Merc -> 1^7 need to remove saber only;seta g_jediVmerc 1"
seta jvm3 "set JediVSMerc vstr jvm4;say ^1All items for mercs ^5Jedi Vs Merc -> 2^7 need to remove saber only;seta g_jediVmerc 2"
seta jvm4 "set JediVSMerc vstr jvm1;say ^5Ampowered Vs SuperMerc -> 3^7 need to remove saber only;seta g_jediVmerc 3"