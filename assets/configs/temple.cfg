// The Vision Temple as a server (docs/japlus/server.md): what makes a server of this tree the temple.
// The temple a server starts for its own players reads this file, and so does the masterserver of VisionJK:
//     +exec temple.cfg +map vision_temple
// It is not for a server that plays levels.

set g_visionTemple 1			// nobody fights and nobody is in the way of another
set g_gametype 0
set timelimit 0
set fraglimit 0
set g_allowVote 0				// nobody votes the temple onto another level
set bot_minplayers 0
set jp_autoQUIT "no"			// and nothing ends its level
set jp_inactivityProtectTimer 0
set sv_pure 0					// whoever comes here comes from another server, with the files of his own version
set g_webPort 0					// no web panel
set sv_hostname "Vision Temple"
set sv_maxclients 32
