////////////////////////////////////////////////////////////////////////
//		JK2 gameplay and damage activation config
//			by slider
//
//	those cvar are built to be used with /rcon vstr or /amvstr cmds
//	amvstr JK2 => it will activate JK2 gameplay and damage
//	amvstr JKA ==> it will come back to normal
//	amvstr JKA_real ==> it will make more cvars like it is in basejka
////////////////////////////////////////////////////////////////////////

seta JK2 "say ^5JK2 gameplay ^6Activation;set jp_slideOnPlayer 0;set jp_improveYellowDFA 1;set jp_jk2RedDFA 1;set jp_allowflipkick 1;seta jp_fixRoll 3;set jp_saberNoForceDrain 1;set jp_noKATA 0;set jp_allowSaberTouchDMG 1;set d_saberSPStyleDamage  0"
seta JKA "say ^5JKA gameplay ^6Activation;set jp_slideOnPlayer 0;set jp_improveYellowDFA 1;set jp_jk2RedDFA 0;set jp_allowflipkick 1;seta jp_fixRoll 2;set jp_saberNoForceDrain 0;set jp_noKATA 0;set jp_allowSaberTouchDMG 1;set d_saberSPStyleDamage  1;set jp_alterDMG 0"

seta JKA_real "say ^5JKA Real gameplay ^6Activation;set jp_slideOnPlayer 1;set jp_improveYellowDFA 0;set jp_jk2RedDFA 0;set jp_allowflipkick 0;seta jp_fixRoll 1;set jp_saberNoForceDrain 0;set jp_noKATA 0;set jp_allowSaberTouchDMG 0;set d_saberSPStyleDamage  1;set jp_alterDMG 0"
