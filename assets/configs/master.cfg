// The masterserver of VisionJK (docs/japlus/server.md, "The masterserver"): the dedicated server built with
// -DBuildMasterServer=ON. Its relay only runs while a level runs, so it loads one that nobody plays on:
//     +exec master.cfg +map mp/duel1
// It is not for a server that plays levels.

set g_gametype 0
set timelimit 0
set fraglimit 0
set g_allowVote 0				// nobody votes another level onto it
set bot_minplayers 0
set jp_autoQUIT "no"			// and nothing ends its level
set jp_inactivityProtectTimer 0
set sv_pure 0
set vs_webBind "127.0.0.1"		// the web panel of the masterserver, on this machine only (ssh -L 8081:127.0.0.1:8081)
set vs_webPort 8081				// 8080 is the one of the game server on the same host
set sv_hostname "VisionJK Masterserver"
set sv_maxclients 1
