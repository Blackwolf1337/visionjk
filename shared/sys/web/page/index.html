<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VisionJK</title>
<!-- no icon: the browser would ask the server for one otherwise -->
<link rel="icon" href="data:,">
<style>
:root {
	--panel: #16161a;
	--panel2: #1d1d22;
	--line: #2a2a31;
	--text: #e4e4e7;
	--muted: #8b8b94;
	--accent: #d50c2d;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--text); font: 14px/1.4 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
/* !important: the window code of the engine may write a size in pixels into the style of the canvas, and the
   canvas is to fill the window all the same */
#canvas { position: fixed; left: 0; top: 0; width: 100% !important; height: 100% !important; display: block; background: #000; outline: none; touch-action: none; }
h1 { margin: 0 0 14px; font-size: 20px; font-weight: 600; letter-spacing: .04em; }
button { font: inherit; color: inherit; background: var(--panel2); border: 1px solid var(--line); border-radius: 3px; padding: 5px 12px; cursor: pointer; }
button:hover { border-color: var(--muted); }

#panel, #error > div { width: min(480px, calc(100% - 32px)); padding: 20px 22px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
#panel { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); }
#status, #detail, #total { min-height: 1.4em; overflow-wrap: anywhere; }
#detail, #total { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
#bar { height: 6px; margin: 12px 0 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
#fill { display: block; width: 0; height: 100%; background: var(--accent); }
.running #panel { display: none; }

#log { position: fixed; left: 8px; bottom: 38px; z-index: 3; margin: 0; max-width: calc(100% - 16px); max-height: 40%; padding: 6px 8px; overflow: hidden; background: rgba(13, 13, 15, .8); border: 1px solid var(--line); border-radius: 3px; color: var(--muted); font: 11px/1.35 ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace; white-space: pre-wrap; overflow-wrap: anywhere; pointer-events: none; }
#log:empty, .nolog #log { display: none; }
#logToggle { position: fixed; left: 8px; bottom: 8px; z-index: 3; padding: 2px 8px; font-size: 11px; color: var(--muted); }
.running #logToggle { opacity: .4; }
.running #logToggle:hover { opacity: 1; }
/* the mouse belongs to the game: nothing to click */
.locked #logToggle { display: none; }

#hint { position: fixed; left: 50%; bottom: 44px; transform: translateX(-50%); padding: 5px 12px; background: rgba(13, 13, 15, .8); border: 1px solid var(--line); border-radius: 3px; font-size: 12px; white-space: nowrap; opacity: 0; pointer-events: none; }
.running #hint { animation: hint 9s ease-in forwards; }
@keyframes hint { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }

#error { position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: 2; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, .72); }
#error[hidden] { display: none; }
#error > div { width: min(560px, calc(100% - 32px)); border-color: var(--accent); }
#errorText { margin: 0 0 16px; max-height: 40vh; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0"></canvas>

<div id="panel">
	<h1>VisionJK</h1>
	<div id="status"><noscript>The game needs JavaScript, which is turned off in this browser.</noscript></div>
	<div id="detail"></div>
	<div id="bar"><i id="fill"></i></div>
	<div id="total"></div>
</div>

<pre id="log"></pre>
<button id="logToggle" type="button">Hide log</button>
<div id="hint">Click the game to capture the mouse, Esc releases it.</div>

<div id="error" hidden>
	<div>
		<h1>VisionJK</h1>
		<p id="errorText"></p>
		<button id="errorButton" type="button">Reload the page</button>
	</div>
</div>

<script src="boot.js"></script>
</body>
</html>
